[project]
name = "pixelforge"
version = "0.1.0"
description = "Text-to-pixel-art game character sprite generator"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3.0",
    "diffusers>=0.27.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "safetensors>=0.4.0",
    "controlnet-aux>=0.0.7",
    "Pillow>=10.0.0",
    "rembg>=2.0.50",
    "numpy>=1.26.0,<2.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0",
    "replicate>=0.25.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "gradio>=4.30.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
